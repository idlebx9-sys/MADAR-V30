version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madar_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://madar_user:madar_secret_pass@mysql:3306/madar_db
      - JWT_SECRET=madar_super_secure_jwt_production_key_2025
      - BASE_DOMAIN=madar.sa
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - madar_data:/app/data

  mysql:
    image: mysql:8.0
    container_name: madar_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: madar_db
      MYSQL_USER: madar_user
      MYSQL_PASSWORD: madar_secret_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  madar_data:
